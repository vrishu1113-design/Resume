
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>StyleHub</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Discover Your Style</h2>
        <p>Fashion that makes you feel confident.</p>
    </section>

    <h2 class="heading">Our Products</h2>

    <section class="container">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400" alt="T-shirt">
            <h3>Classic T-Shirt</h3>
            <p>₹799</p>
            <button>Shop Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1542272604-787c3835535d?w=400" alt="Jeans">
            <h3>Blue Jeans</h3>
            <p>₹1,499</p>
            <button>Shop Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1544441893-675973e31985?w=400" alt="Jacket">
            <h3>Stylish Jacket</h3>
            <p>₹1,999</p>
            <button>Shop Now</button>
        </div>

    </section>

    <footer>
        <p>&copy; 2026 StyleHub. All rights reserved.</p>
    </footer>
