
<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model Experiment</title>
    <link rel="stylesheet" href="styless.css">
</head>
<body>

    <header>
        <h1>CSS Box Model Experiment</h1>
        <p>Understanding Width, Height and Box Sizing</p>
    </header>

    <section class="container">

        <div class="box content-box">
            <h2>Content Box</h2>
            <p>This box uses the default box-sizing property.</p>
        </div>

        <div class="box border-box">
            <h2>Border Box</h2>
            <p>This box uses box-sizing: border-box.</p>
        </div>

    </section>

</body>
</html>
